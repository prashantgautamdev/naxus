name: Deploy static site to Pages

on:
  push:
    branches: ["main"]   # apni default branch ka naam yahan check kar lein (main/master)
  workflow_dispatch:       # manually bhi run kar sakte hain Actions tab se

# Sirf ek deployment ek time par chale
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # agar aapki index.html kisi folder (jaise "dist" ya "public") me hai to yahan wo path likhein

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
